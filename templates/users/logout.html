<!-- templates/users/logout.html -->
{% extends "users/base.html" %}

{% block title %}Выход{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow text-center">
            <div class="card-body p-4">
                <h3 class="card-title mb-3">Вы вышли</h3>
                <p class="text-muted mb-4">Вы успешно завершили сеанс.</p>
                <a href="{% url 'users:login' %}" class="btn btn-primary w-100">Войти снова</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
